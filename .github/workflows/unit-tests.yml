name: Unit Tests

# Runs Networking-scoped logic tests on the FFmpeg-free macOS
# PrairieNetworkingHost framework and enforces a 95% line-coverage gate over
# unit-testable `/Networking/`.
#
# Coverage gate choice:
#   Default scope is `/Networking/` minus live HTTP / session modules
#   (PrairieAPI, HTTPClient, store refreshers, FramedJSONSession, …).
#   See scripts/check-xccov-coverage.sh.
#
# CI speed:
#   Full Prairie.app links vendored FFmpeg and dominates wall clock (~5–6m
#   compile even when tests are scoped). PrairieNetworkingCI builds a thin
#   macOS framework (no FFmpeg/Nuke, no iOS simulator) so cold CI can target
#   ~2–3 minutes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode (latest)
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "error: no Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: iosApp/DerivedData
          key: netci-mac-${{ runner.os }}-${{ hashFiles('iosApp/project.yml', 'iosApp/iosApp/Networking/**/*.swift', 'iosApp/iosApp/Shared/SharedStorage.swift', 'iosApp/iosApp/Shared/KeychainAudience.swift', 'iosApp/iosApp/Shared/ImageSizeSelection.swift', 'iosApp/iosApp/Shared/AppleDecodeCapabilities.swift', 'iosApp/iosApp/Shared/ProfileLaunchBehavior.swift', 'iosApp/iosApp/Shared/ProfileLaunchState.swift', 'iosApp/iosApp/Shared/RememberedProfile.swift', 'iosApp/iosApp/Shared/ProfileLaunchResolution.swift', 'iosApp/iosApp/Navigation/UICustomizationPreferences.swift', 'iosApp/iosApp/Navigation/TabRouter.swift', 'iosApp/iosApp/Navigation/AppNavPreferences.swift', 'iosApp/iosApp/Screens/Profiles/ProfileLaunchPreferences.swift', 'iosApp/iosApp/Shared/AppleDeviceIdentity.swift', 'iosApp/iosApp/Screens/Auth/AuthModels.swift', 'iosApp/iosApp/Screens/Calendar/CalendarModels.swift', 'iosApp/iosApp/Screens/Player/Subtitles/SubtitleAppearance.swift', 'iosApp/iosApp/Screens/Player/ProtocolV3/PlaybackProtocolV3Models.swift', 'iosApp/iosApp/Shared/ArtworkURL.swift', 'iosApp/iosApp/Shared/MediaLogRedactor.swift', 'iosApp/iosApp/Shared/CatalogPathSegment.swift', 'iosApp/iosApp/Shared/AccountSessionPersistence.swift', 'iosApp/iosApp/Downloads/DownloadModels.swift', 'iosApp/iosApp/Screens/Profiles/ProfileTransitionError.swift', 'iosApp/iosApp/Navigation/SeriesDetailContext.swift', 'iosApp/iosApp/Screens/Player/StreamRequest.swift', 'iosApp/iosApp/Screens/Browse/Filtering/*.swift', 'iosApp/iosApp/Screens/Audio/AudiobookPlaybackContext.swift', 'iosApp/iosApp/Screens/Detail/AudiobookDetailFormatting.swift', 'iosApp/iosApp/WatchParty/WatchPartyInvitation.swift', 'iosApp/iosApp/WatchParty/WatchPartySocket.swift', 'iosApp/iosApp/Shared/PrairieURLScheme.swift', 'iosApp/CI/NetworkingHost/**/*.swift', 'iosApp/Tests/Networking*.swift', 'iosApp/Tests/TokenStore*.swift', 'iosApp/Tests/ServerRegistry*.swift', 'iosApp/Tests/WireFormat*.swift', 'iosApp/Tests/AuthAndDevice*.swift', 'iosApp/Tests/ResponseCache*.swift', 'iosApp/Tests/PrairieFrame*.swift', 'iosApp/Tests/TrackSelection*.swift', 'iosApp/Tests/LiveTVModel*.swift', 'iosApp/Tests/AIModel*.swift', 'iosApp/Tests/PlaybackPrefs*.swift', 'iosApp/Tests/SubtitleSearch*.swift', 'iosApp/Tests/AppUpdate*.swift', 'iosApp/Tests/AIJob*.swift', 'iosApp/Tests/LibraryVisibility*.swift', 'iosApp/Tests/SettingValuesAPITests.swift', 'iosApp/Tests/SettingsContractResolve.swift', 'iosApp/Tests/ItemVideosDecodingTests.swift', 'iosApp/Tests/Fixtures/SettingsContract/**', 'iosApp/Tests/APIv2FixtureTestSupport.swift', 'iosApp/Tests/Support/**', 'iosApp/Tests/APIv2CatalogReadProjectionTests.swift', 'iosApp/Tests/APIv2PlaybackModelsTests.swift', 'iosApp/Tests/APIv2WireModelsTests.swift', 'iosApp/Tests/APIv2CatalogQueryAndSyncTests.swift', 'iosApp/Tests/MetadataRequestPoolTests.swift', 'iosApp/Tests/ServerIdentityProbeTests.swift', 'iosApp/Tests/TokenStoreSessionTests.swift', 'iosApp/Tests/CatalogShapeModelsTests.swift', 'iosApp/Tests/WatchPartyModelsTests.swift', 'iosApp/Tests/APIv2SubtitleSearchModelsTests.swift', 'iosApp/Tests/TokenStoreFailureTests.swift', 'iosApp/Tests/ServerRegistryEdgeTests.swift', 'iosApp/Tests/PlaybackV3FixtureTestSupport.swift', 'iosApp/Tests/Fixtures/PlaybackV3/**', 'iosApp/Tests/CredentialIdentityTests.swift', 'iosApp/Tests/MediaRequestAuthorizationTests.swift', 'iosApp/Tests/MetadataSingleFlightTests.swift', 'iosApp/Tests/PersonalListsAPITests.swift', 'iosApp/Tests/ServerIdentityMatchingTests.swift', 'iosApp/Tests/SettingValueWritesTests.swift', 'iosApp/Tests/SharedDefaultsTests.swift', 'iosApp/Tests/SharedKeychainCheckedReadTests.swift', 'iosApp/Tests/WatchPartyAPITests.swift', 'iosApp/Tests/Fixtures/APIv2/**', 'iosApp/Tests/APIv2ContractTests.swift', 'iosApp/Tests/APIv2MutationOutcomeTests.swift', 'iosApp/Tests/CatalogActionsAPITests.swift', 'iosApp/Tests/CatalogV2Tests.swift', 'iosApp/Tests/CollectionsV2Tests.swift', 'iosApp/Tests/LibraryBrowseV2Tests.swift', 'iosApp/Tests/MetadataAIV2Tests.swift', 'iosApp/Tests/OnboardingV2Tests.swift', 'iosApp/Tests/TrackPreferencesV2Tests.swift') }}
          restore-keys: |
            netci-mac-${{ runner.os }}-

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build Networking CI framework for testing
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Prairie.xcodeproj \
            -scheme PrairieNetworkingCI \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Run Networking tests with coverage
        working-directory: iosApp
        run: |
          set -euo pipefail

          NETWORKING_TESTS=(
            PrairieNetworkingTests/NetworkingGateBoostTests
            PrairieNetworkingTests/NetworkingModelsCoverageTests
            PrairieNetworkingTests/NetworkingModelsGateFillTests
            PrairieNetworkingTests/NetworkingPrairieGateFillTests
            PrairieNetworkingTests/NetworkingPrairieRegistryGateFillTests
            PrairieNetworkingTests/NetworkingPrairieTokenStoreGateFillTests
            PrairieNetworkingTests/TokenStorePersistenceTests
            PrairieNetworkingTests/TokenStoreDiagnosticsTests
            PrairieNetworkingTests/ServerRegistryMigrationTests
            PrairieNetworkingTests/WireFormatAndRequestsModelTests
            PrairieNetworkingTests/AuthAndDeviceLoginModelTests
            PrairieNetworkingTests/ResponseCacheTests
            PrairieNetworkingTests/PrairieFrameTests
            PrairieNetworkingTests/TrackSelectionPersistenceTests
            PrairieNetworkingTests/LiveTVModelDecodingTests
            PrairieNetworkingTests/AIModelDecodingTests
            PrairieNetworkingTests/PlaybackPrefsModelTests
            PrairieNetworkingTests/SubtitleSearchModelTests
            PrairieNetworkingTests/AppUpdateCheckerTests
            PrairieNetworkingTests/AIJobPollerTests
            PrairieNetworkingTests/LibraryVisibilityTests
            PrairieNetworkingTests/PrairieQualityPresetsTests
            PrairieNetworkingTests/SettingValueModelsGateFillTests
            PrairieNetworkingTests/SettingValuesAPITests
            PrairieNetworkingTests/ItemVideosDecodingTests
            PrairieNetworkingTests/APIv2ContractTests
            PrairieNetworkingTests/APIv2MutationOutcomeTests
            PrairieNetworkingTests/CatalogActionsAPITests
            PrairieNetworkingTests/CatalogV2Tests
            PrairieNetworkingTests/CollectionsV2Tests
            PrairieNetworkingTests/LibraryBrowseV2Tests
            PrairieNetworkingTests/MetadataAIV2Tests
            PrairieNetworkingTests/OnboardingV2Tests
            PrairieNetworkingTests/TrackPreferencesV2Tests
            PrairieNetworkingTests/APIv2CatalogReadProjectionTests
            PrairieNetworkingTests/APIv2PlaybackModelsTests
            PrairieNetworkingTests/APIv2WireModelsTests
            PrairieNetworkingTests/APIv2CatalogQueryAndSyncTests
            PrairieNetworkingTests/MetadataRequestPoolTests
            PrairieNetworkingTests/ServerIdentityProbeTests
            PrairieNetworkingTests/TokenStoreSessionTests
            PrairieNetworkingTests/CatalogShapeModelsTests
            PrairieNetworkingTests/WatchPartyModelsTests
            PrairieNetworkingTests/APIv2SubtitleSearchModelsTests
            PrairieNetworkingTests/TokenStoreFailureTests
            PrairieNetworkingTests/ServerRegistryEdgeTests
            PrairieNetworkingTests/CredentialIdentityTests
            PrairieNetworkingTests/MediaRequestAuthorizationTests
            PrairieNetworkingTests/MetadataSingleFlightTests
            PrairieNetworkingTests/PersonalListsAPITests
            PrairieNetworkingTests/ServerIdentityMatchingTests
            PrairieNetworkingTests/SettingValueWritesTests
            PrairieNetworkingTests/SharedDefaultsTests
            PrairieNetworkingTests/SharedKeychainCheckedReadTests
            PrairieNetworkingTests/WatchPartyAPITests
          )

          ONLY_TESTING_ARGS=()
          for t in "${NETWORKING_TESTS[@]}"; do
            ONLY_TESTING_ARGS+=(-only-testing:"$t")
          done

          xcodebuild test-without-building \
            -project Prairie.xcodeproj \
            -scheme PrairieNetworkingCI \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            "${ONLY_TESTING_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export coverage JSON
        working-directory: iosApp
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d TestResults.xcresult ]]; then
            echo "No TestResults.xcresult bundle; skipping coverage export"
            exit 0
          fi
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: List uncovered Networking lines
        working-directory: iosApp
        if: always()
        run: |
          # Diagnostic only: never fail the job from here.
          set +e
          [[ -d TestResults.xcresult ]] || exit 0
          # Print the unexecuted line ranges of each partly covered file in the
          # gate scope, so a coverage drop can be traced without a Mac.
          xcrun xccov view --archive --file-list TestResults.xcresult 2>/dev/null \
            | grep '/Networking/' | while read -r file; do
              ranges=$(xcrun xccov view --archive --file "$file" TestResults.xcresult 2>/dev/null \
                | awk -F: '$2 ~ /^ *0( |$)/ { n = $1 + 0; if (n == last + 1) { last = n } else { if (start) printf "%s%s ", start, (last > start ? "-" last : ""); start = n; last = n } }
                           END { if (start) printf "%s%s", start, (last > start ? "-" last : "") }')
              if [[ -n "$ranges" ]]; then echo "${file##*/iosApp/iosApp/}: $ranges"; fi
            done
          exit 0

      - name: Enforce 95% Networking unit-test coverage gate
        run: |
          set -euo pipefail
          if [[ ! -f iosApp/coverage.json ]]; then
            echo "error: coverage.json missing; cannot enforce 95% gate" >&2
            exit 1
          fi
          scripts/check-xccov-coverage.sh iosApp/coverage.json 95

      - name: Upload coverage JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prairie-unit-test-coverage
          path: |
            iosApp/coverage.json
            iosApp/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7
