name: Unit Tests

# Runs Networking-scoped logic tests on the FFmpeg-free macOS
# PrairieNetworkingHost framework and enforces a 95% line-coverage gate over
# unit-testable `/Networking/`.
#
# Coverage gate choice:
#   Default scope is `/Networking/` minus live HTTP / session modules
#   (ContinuumAPI, HTTPClient, store refreshers, FramedJSONSession, …).
#   See scripts/check-xccov-coverage.sh.
#
# CI speed:
#   Full Prairie.app links vendored FFmpeg and dominates wall clock (~5–6m
#   compile even when tests are scoped). PrairieNetworkingCI builds a thin
#   macOS framework (no FFmpeg/Nuke, no iOS simulator) so cold CI can target
#   ~2–3 minutes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode (latest)
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "error: no Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Cache Xcode DerivedData
        uses: actions/cache@v6
        with:
          path: iosApp/DerivedData
          key: netci-mac-${{ runner.os }}-${{ hashFiles('iosApp/project.yml', 'iosApp/iosApp/Networking/**/*.swift', 'iosApp/iosApp/Shared/SharedStorage.swift', 'iosApp/iosApp/Shared/AppleDeviceIdentity.swift', 'iosApp/CI/NetworkingHost/**/*.swift', 'iosApp/Tests/Networking*.swift', 'iosApp/Tests/TokenStore*.swift', 'iosApp/Tests/ServerRegistry*.swift', 'iosApp/Tests/WireFormat*.swift', 'iosApp/Tests/AuthAndDevice*.swift', 'iosApp/Tests/ResponseCache*.swift', 'iosApp/Tests/PrairieFrame*.swift', 'iosApp/Tests/TrackSelection*.swift', 'iosApp/Tests/LiveTVModel*.swift', 'iosApp/Tests/AIModel*.swift', 'iosApp/Tests/PlaybackPrefs*.swift', 'iosApp/Tests/SubtitleSearch*.swift', 'iosApp/Tests/AppUpdate*.swift', 'iosApp/Tests/AIJob*.swift', 'iosApp/Tests/LibraryVisibility*.swift') }}
          restore-keys: |
            netci-mac-${{ runner.os }}-

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build Networking CI framework for testing
        working-directory: iosApp
        run: |
          set -euo pipefail
          # Build the framework first so compile errors aren't masked by the
          # test bundle's "Unable to find module 'Prairie'" cascade.
          xcodebuild build \
            -project Prairie.xcodeproj \
            -target PrairieNetworkingHost \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES
          xcodebuild build-for-testing \
            -project Prairie.xcodeproj \
            -scheme PrairieNetworkingCI \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Run Networking tests with coverage
        working-directory: iosApp
        run: |
          set -euo pipefail

          NETWORKING_TESTS=(
            PrairieNetworkingTests/NetworkingGateBoostTests
            PrairieNetworkingTests/NetworkingModelsCoverageTests
            PrairieNetworkingTests/NetworkingModelsGateFillTests
            PrairieNetworkingTests/TokenStorePersistenceTests
            PrairieNetworkingTests/ServerRegistryMigrationTests
            PrairieNetworkingTests/WireFormatAndRequestsModelTests
            PrairieNetworkingTests/AuthAndDeviceLoginModelTests
            PrairieNetworkingTests/ResponseCacheTests
            PrairieNetworkingTests/PrairieFrameTests
            PrairieNetworkingTests/TrackSelectionPersistenceTests
            PrairieNetworkingTests/LiveTVModelDecodingTests
            PrairieNetworkingTests/AIModelDecodingTests
            PrairieNetworkingTests/PlaybackPrefsModelTests
            PrairieNetworkingTests/SubtitleSearchModelTests
            PrairieNetworkingTests/AppUpdateCheckerTests
            PrairieNetworkingTests/AIJobPollerTests
            PrairieNetworkingTests/LibraryVisibilityTests
          )

          ONLY_TESTING_ARGS=()
          for t in "${NETWORKING_TESTS[@]}"; do
            ONLY_TESTING_ARGS+=(-only-testing:"$t")
          done

          xcodebuild test-without-building \
            -project Prairie.xcodeproj \
            -scheme PrairieNetworkingCI \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -quiet \
            "${ONLY_TESTING_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export coverage JSON
        working-directory: iosApp
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d TestResults.xcresult ]]; then
            echo "No TestResults.xcresult bundle; skipping coverage export"
            exit 0
          fi
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Enforce 95% Networking unit-test coverage gate
        run: |
          set -euo pipefail
          if [[ ! -f iosApp/coverage.json ]]; then
            echo "error: coverage.json missing; cannot enforce 95% gate" >&2
            exit 1
          fi
          scripts/check-xccov-coverage.sh iosApp/coverage.json 95

      - name: Upload coverage JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prairie-unit-test-coverage
          path: |
            iosApp/coverage.json
            iosApp/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7
