name: Unit Tests

# Runs a Networking-scoped PrairieTests subset with code coverage and enforces
# a 95% line-coverage gate.
#
# Coverage gate choice:
#   Default scope is `/Networking/` minus live HTTP / session modules
#   (ContinuumAPI, HTTPClient, store refreshers, FramedJSONSession, …).
#   That matches AGENTS.md: unit-testable Networking (models, persistence,
#   frame codecs, response cache). See scripts/check-xccov-coverage.sh.
#
# CI speed:
#   Full PrairieTests (~888 cases) includes FFmpeg/loopback/playback suites that
#   dominate wall clock. The gate only measures Networking, so CI runs the
#   dedicated Networking XCTest classes via -only-testing. Build still links the
#   full Prairie.app TEST_HOST (FFmpeg included); wins come from (1) skipping
#   unrelated tests, (2) DerivedData/SPM cache via actions/cache@v6, (3) skipping
#   bootstatus waits, (4) build-for-testing + test-without-building.
#   Warm runs (DerivedData hit) target ~2–3 minutes; cold compiles still pay the
#   FFmpeg-linked app build once to seed the cache.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode (latest)
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "error: no Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Cache Xcode DerivedData + SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            iosApp/DerivedData
            iosApp/SourcePackages
          key: xcode-${{ runner.os }}-${{ hashFiles('iosApp/project.yml', 'iosApp/Vendor/ffmpeg-build/Package.swift', 'iosApp/iosApp/**/*.swift', 'iosApp/Tests/**/*.swift') }}
          restore-keys: |
            xcode-${{ runner.os }}-

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Resolve iOS Simulator destination
        id: sim
        run: |
          set -euo pipefail
          CANDIDATES=("iPhone 17" "iPhone 17 Pro" "iPhone 16" "iPhone 16 Pro" "iPhone 15")
          SIM_LIST="$(xcrun simctl list devices available || true)"
          echo "Available simulators:"
          echo "$SIM_LIST" | grep -E '^[[:space:]]*iPhone ' || true

          pick=""
          for name in "${CANDIDATES[@]}"; do
            if echo "$SIM_LIST" | grep -E "^[[:space:]]*${name}[[:space:]]+\(" >/dev/null 2>&1; then
              pick="$name"
              break
            fi
          done

          if [[ -z "$pick" ]]; then
            pick="$(echo "$SIM_LIST" \
              | grep -E '^[[:space:]]*iPhone ' \
              | head -n 1 \
              | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\([^)]*\)[[:space:]]*\([^)]*\)[[:space:]]*$//; s/[[:space:]]+$//')"
          fi

          if [[ -z "$pick" ]]; then
            echo "error: no iPhone simulator available" >&2
            exit 1
          fi

          echo "Using simulator: $pick"
          echo "destination=platform=iOS Simulator,name=${pick}" >> "$GITHUB_OUTPUT"
          # Kick boot without waiting on bootstatus (~60s). xcodebuild waits if needed.
          xcrun simctl boot "$pick" 2>/dev/null || true

      - name: Build for testing
        working-directory: iosApp
        run: |
          set -euo pipefail
          DEST="${{ steps.sim.outputs.destination }}"
          # Coverage instrumentation must be enabled at build-for-testing time;
          # test-without-building alone yields an empty/broken xccov archive.
          xcodebuild build-for-testing \
            -project Prairie.xcodeproj \
            -scheme Prairie \
            -destination "$DEST" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -enableCodeCoverage YES \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Run Networking PrairieTests with coverage
        working-directory: iosApp
        run: |
          set -euo pipefail
          DEST="${{ steps.sim.outputs.destination }}"

          NETWORKING_TESTS=(
            PrairieTests/NetworkingGateBoostTests
            PrairieTests/NetworkingModelsCoverageTests
            PrairieTests/NetworkingModelsGateFillTests
            PrairieTests/TokenStorePersistenceTests
            PrairieTests/ServerRegistryMigrationTests
            PrairieTests/WireFormatAndRequestsModelTests
            PrairieTests/AuthAndDeviceLoginModelTests
            PrairieTests/ResponseCacheTests
            PrairieTests/PrairieFrameTests
            PrairieTests/TrackSelectionPersistenceTests
            PrairieTests/LiveTVModelDecodingTests
            PrairieTests/AIModelDecodingTests
            PrairieTests/PlaybackPrefsModelTests
            PrairieTests/SubtitleSearchModelTests
            PrairieTests/AppUpdateCheckerTests
            PrairieTests/AIJobPollerTests
            PrairieTests/PairingCoordinatorTests
            PrairieTests/LibraryVisibilityTests
          )

          ONLY_TESTING_ARGS=()
          for t in "${NETWORKING_TESTS[@]}"; do
            ONLY_TESTING_ARGS+=(-only-testing:"$t")
          done

          xcodebuild test-without-building \
            -project Prairie.xcodeproj \
            -scheme Prairie \
            -destination "$DEST" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -quiet \
            "${ONLY_TESTING_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export coverage JSON
        working-directory: iosApp
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d TestResults.xcresult ]]; then
            echo "No TestResults.xcresult bundle; skipping coverage export"
            exit 0
          fi
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Enforce 95% Networking unit-test coverage gate
        run: |
          set -euo pipefail
          if [[ ! -f iosApp/coverage.json ]]; then
            echo "error: coverage.json missing; cannot enforce 95% gate" >&2
            exit 1
          fi
          scripts/check-xccov-coverage.sh iosApp/coverage.json 95

      - name: Upload coverage JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prairie-unit-test-coverage
          path: |
            iosApp/coverage.json
            iosApp/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 7
