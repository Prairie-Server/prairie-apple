name: Unit Tests

# Runs a Networking-scoped PrairieTests subset with code coverage and enforces
# a 95% line-coverage gate.
#
# Coverage gate choice:
#   Default scope is `/Networking/` minus live HTTP / session modules
#   (ContinuumAPI, HTTPClient, store refreshers, FramedJSONSession, …).
#   That matches AGENTS.md: unit-testable Networking (models, persistence,
#   frame codecs, response cache). See scripts/check-xccov-coverage.sh.
#
# CI speed:
#   Full PrairieTests (~888 cases) includes FFmpeg/loopback/playback suites that
#   dominate wall clock and have been flaky under parallel simulator clones.
#   The gate only measures Networking, so CI runs the dedicated Networking
#   XCTest classes via -only-testing. Build still links the full Prairie.app
#   TEST_HOST (FFmpeg included); the win is skipping hundreds of unrelated tests.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Select Xcode (latest)
        run: |
          # Prefer the newest installed Xcode; iOS deployment target is 26.0.
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "error: no Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Cache SwiftPM clones
        uses: actions/cache@v4
        with:
          path: iosApp/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('iosApp/**/Package.resolved', 'iosApp/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Resolve iOS Simulator destination
        id: sim
        run: |
          set -euo pipefail
          # Prefer newer iPhone sims first (Xcode 26+ often ships 17 without 16).
          # Use simctl only on the hot path — xcodebuild -showdestinations is ~45s.
          CANDIDATES=("iPhone 17" "iPhone 17 Pro" "iPhone 16" "iPhone 16 Pro" "iPhone 15")
          SIM_LIST="$(xcrun simctl list devices available || true)"
          echo "Available simulators:"
          echo "$SIM_LIST" | grep -E '^[[:space:]]*iPhone ' || true

          pick=""
          for name in "${CANDIDATES[@]}"; do
            # simctl lines look like: "    iPhone 17 (UUID) (Shutdown)"
            if echo "$SIM_LIST" | grep -E "^[[:space:]]*${name}[[:space:]]+\(" >/dev/null 2>&1; then
              pick="$name"
              break
            fi
          done

          if [[ -z "$pick" ]]; then
            # Fallback: first available iPhone from simctl.
            pick="$(echo "$SIM_LIST" \
              | grep -E '^[[:space:]]*iPhone ' \
              | head -n 1 \
              | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\([^)]*\)[[:space:]]*\([^)]*\)[[:space:]]*$//; s/[[:space:]]+$//')"
          fi

          if [[ -z "$pick" ]]; then
            # Last resort (~45s): ask xcodebuild for destinations.
            DEST_LIST="$(xcodebuild -project iosApp/Prairie.xcodeproj -scheme Prairie -showdestinations 2>/dev/null || true)"
            for name in "${CANDIDATES[@]}"; do
              if echo "$DEST_LIST" | grep -E "name:${name}(,|\$)" >/dev/null 2>&1; then
                pick="$name"
                break
              fi
            done
          fi

          if [[ -n "$pick" ]]; then
            echo "Using simulator: $pick"
            echo "destination=platform=iOS Simulator,name=${pick}" >> "$GITHUB_OUTPUT"
            echo "sim_name=${pick}" >> "$GITHUB_OUTPUT"
          else
            echo "No named iPhone simulator found; using generic/platform=iOS Simulator"
            echo "destination=generic/platform=iOS Simulator" >> "$GITHUB_OUTPUT"
            echo "sim_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Boot simulator
        if: steps.sim.outputs.sim_name != ''
        run: |
          set -euo pipefail
          # Warm the chosen device before xcodebuild so boot cost overlaps less
          # with the first test launch.
          xcrun simctl boot "${{ steps.sim.outputs.sim_name }}" 2>/dev/null || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.sim_name }}" -b || true

      - name: Run Networking PrairieTests with coverage
        working-directory: iosApp
        run: |
          set -euo pipefail
          DEST="${{ steps.sim.outputs.destination }}"
          echo "destination=$DEST"

          # XCTest classes that exercise the gated /Networking/ surface. Keep this
          # list aligned with scripts/check-xccov-coverage.sh includes (models,
          # TokenStore, ServerRegistry, ResponseCache, PrairieFrame, prefs models,
          # TrackSelectionPersistence, AppUpdateChecker, AIJobPoller, …).
          NETWORKING_TESTS=(
            PrairieTests/NetworkingGateBoostTests
            PrairieTests/NetworkingModelsCoverageTests
            PrairieTests/TokenStorePersistenceTests
            PrairieTests/ServerRegistryMigrationTests
            PrairieTests/WireFormatAndRequestsModelTests
            PrairieTests/AuthAndDeviceLoginModelTests
            PrairieTests/ResponseCacheTests
            PrairieTests/PrairieFrameTests
            PrairieTests/TrackSelectionPersistenceTests
            PrairieTests/LiveTVModelDecodingTests
            PrairieTests/AIModelDecodingTests
            PrairieTests/PlaybackPrefsModelTests
            PrairieTests/SubtitleSearchModelTests
            PrairieTests/AppUpdateCheckerTests
            PrairieTests/AIJobPollerTests
            PrairieTests/PairingCoordinatorTests
            # Extra Models.swift coverage used by the 95% gate (memberwise inits /
            # library visibility / audiobook detail decode paths). Still cheap vs
            # FFmpeg/loopback/playback suites.
            PrairieTests/LibraryVisibilityTests
            PrairieTests/DetailVersionSelectionTests
            PrairieTests/HomeSectionsMutationTests
            PrairieTests/BrowseViewModelTests
            PrairieTests/PlaybackMediaFixtureTests
          )

          ONLY_TESTING_ARGS=()
          for t in "${NETWORKING_TESTS[@]}"; do
            ONLY_TESTING_ARGS+=(-only-testing:"$t")
          done

          # No parallel simulator clones (previously ~26m + IPC flakes).
          # No -retry-tests-on-failure: Networking model tests are deterministic
          # and retries double wall clock when anything flakes.
          xcodebuild test \
            -project Prairie.xcodeproj \
            -scheme Prairie \
            -destination "$DEST" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -clonedSourcePackagesDirPath SourcePackages \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            "${ONLY_TESTING_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Export coverage JSON
        working-directory: iosApp
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d TestResults.xcresult ]]; then
            echo "No TestResults.xcresult bundle; skipping coverage export"
            exit 0
          fi
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          # Also emit a human-readable summary for the job log.
          xcrun xccov view --report TestResults.xcresult | tee coverage-report.txt

      - name: Enforce 95% Networking unit-test coverage gate
        # Gates /Networking/ (excluding live HTTP clients). See script defaults.
        run: |
          set -euo pipefail
          if [[ ! -f iosApp/coverage.json ]]; then
            echo "error: coverage.json missing; cannot enforce 95% gate" >&2
            exit 1
          fi
          scripts/check-xccov-coverage.sh iosApp/coverage.json 95

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prairie-unit-test-coverage
          path: |
            iosApp/TestResults.xcresult
            iosApp/coverage.json
            iosApp/coverage-report.txt
          if-no-files-found: warn
          retention-days: 14
