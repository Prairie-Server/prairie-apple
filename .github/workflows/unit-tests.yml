name: Unit Tests

# Runs PrairieTests with code coverage and enforces a 75% line-coverage gate.
#
# Coverage gate choice:
#   Overall Prairie.app coverage includes large SwiftUI surfaces that unit tests
#   do not exercise, so a 75% *overall* gate is unrealistic today. Instead we
#   gate line coverage for files under iosApp/iosApp/Networking/ (API clients,
#   stores, and model/wire types colocated there — Models.swift, *Models.swift,
#   including Live TV). That is the product surface PrairieTests primarily
#   covers. See scripts/check-xccov-coverage.sh.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Select Xcode (latest)
        run: |
          # Prefer the newest installed Xcode; iOS deployment target is 26.0.
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "error: no Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Using ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Resolve iOS Simulator destination
        id: sim
        run: |
          set -euo pipefail
          # Prefer iPhone 16 (task default); fall back to common names on the runner image.
          CANDIDATES=("iPhone 16" "iPhone 16 Pro" "iPhone 17" "iPhone 17 Pro" "iPhone 15")
          DEST_LIST="$(xcodebuild -project iosApp/Prairie.xcodeproj -scheme Prairie -showdestinations 2>/dev/null || true)"
          SIM_LIST="$(xcrun simctl list devices available || true)"

          pick=""
          for name in "${CANDIDATES[@]}"; do
            if echo "$DEST_LIST" | grep -Fq "name:${name}"; then
              pick="$name"
              break
            fi
            if echo "$SIM_LIST" | grep -Fq "$name"; then
              pick="$name"
              break
            fi
          done

          if [[ -z "$pick" ]]; then
            # Last resort: first available iPhone line from simctl
            # (format: "    iPhone 16 (UUID) (Shutdown)").
            pick="$(echo "$SIM_LIST" \
              | grep -E '^[[:space:]]*iPhone ' \
              | head -n 1 \
              | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\([^)]*\)[[:space:]]*\([^)]*\)[[:space:]]*$//; s/[[:space:]]+$//')"
          fi

          if [[ -z "$pick" ]]; then
            echo "error: no iPhone simulator available" >&2
            echo "$SIM_LIST" >&2
            echo "$DEST_LIST" >&2
            exit 1
          fi

          echo "Using simulator: $pick"
          echo "name=$pick" >> "$GITHUB_OUTPUT"

      - name: Run PrairieTests with coverage
        working-directory: iosApp
        run: |
          set -euo pipefail
          DEST="platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"
          echo "destination=$DEST"
          xcodebuild test \
            -project Prairie.xcodeproj \
            -scheme Prairie \
            -destination "$DEST" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export coverage JSON
        working-directory: iosApp
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d TestResults.xcresult ]]; then
            echo "No TestResults.xcresult bundle; skipping coverage export"
            exit 0
          fi
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          # Also emit a human-readable summary for the job log.
          xcrun xccov view --report TestResults.xcresult | tee coverage-report.txt

      - name: Enforce 75% Networking coverage gate
        # Gates iosApp/iosApp/Networking/ (models included) — not overall app UI.
        # See workflow header comment and scripts/check-xccov-coverage.sh.
        run: |
          set -euo pipefail
          if [[ ! -f iosApp/coverage.json ]]; then
            echo "error: coverage.json missing; cannot enforce 75% gate" >&2
            exit 1
          fi
          scripts/check-xccov-coverage.sh iosApp/coverage.json 75 /Networking/

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prairie-unit-test-coverage
          path: |
            iosApp/TestResults.xcresult
            iosApp/coverage.json
            iosApp/coverage-report.txt
          if-no-files-found: warn
          retention-days: 14
