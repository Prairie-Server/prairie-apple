name: TestFlight Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.4.0)'
        required: true
        type: string

# Serialize releases: each run computes latest_testflight_build_number + 1,
# so overlapping runs would collide. Let an in-flight release finish.
concurrency:
  group: testflight-release
  cancel-in-progress: false

env:
  XCODEGEN_VERSION: "2.43.0"
  TESTFLIGHT_DISTRIBUTION: external
  TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS: "true"

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + history for changelog fallback

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          sudo /tmp/xcodegen-dist/xcodegen/install.sh /usr/local
          xcodegen --version

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Resolve marketing version
        id: ver
        run: |
          V="$(scripts/ci/resolve-marketing-version.sh \
                '${{ github.event_name }}' '${{ github.ref_name }}' '${{ inputs.version }}')"
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved marketing version: $V"

      - name: Build & upload iOS to TestFlight
        run: bundle exec fastlane ios beta_ios
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.value }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}

  tvos:
    needs: ios   # enforce iOS-before-tvOS build-number ordering
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          sudo /tmp/xcodegen-dist/xcodegen/install.sh /usr/local
          xcodegen --version

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Resolve marketing version
        id: ver
        run: |
          V="$(scripts/ci/resolve-marketing-version.sh \
                '${{ github.event_name }}' '${{ github.ref_name }}' '${{ inputs.version }}')"
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved marketing version: $V"

      - name: Build & upload tvOS to TestFlight
        run: bundle exec fastlane ios beta_tvos
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.value }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUPS }}
