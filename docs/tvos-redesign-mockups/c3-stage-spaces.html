<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stage — Spaces (library switcher)</title>
<link rel="stylesheet" href="tv.css">
<style>
  body { background: radial-gradient(120% 90% at 50% -20%, #0c0e13 0%, #000 65%); }

  .hd { position: absolute; z-index: 20; left: var(--safe-x); top: 64px; right: var(--safe-x); display: flex; align-items: baseline; }
  .hd h1 { font-family: var(--font-serif); font-weight: 600; font-size: 64px; letter-spacing: 0.01em; }
  .hd .sub { margin-left: 28px; font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.22em; color: var(--ink-3); }
  .hd .hint { margin-left: auto; font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.18em; color: var(--ink-3); }
  .hd .hint b { color: var(--ink-2); }

  .grid {
    position: absolute; z-index: 20; left: var(--safe-x); right: var(--safe-x); top: 196px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 30px;
  }
  .space {
    position: relative; height: 384px; border-radius: 26px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.10);
  }
  .space.focused {
    outline: 4px solid rgba(255,255,255,0.95); outline-offset: 6px;
    transform: scale(1.022); z-index: 5;
  }
  .space .bg { position: absolute; inset: 0; }
  .space .bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(102deg, rgba(0,0,0,0.78) 18%, rgba(0,0,0,0.30) 58%, rgba(0,0,0,0.12) 100%);
  }
  .space .inner { position: absolute; inset: 0; z-index: 3; padding: 44px 48px; display: flex; flex-direction: column; }
  .space .ic { color: rgba(255,255,255,0.85); margin-bottom: auto; }
  .space h2 { font-family: var(--font-serif); font-weight: 600; font-size: 56px; letter-spacing: 0.01em; }
  .space .ct { font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.20em; color: rgba(255,255,255,0.62); margin-top: 12px; }
  .space .chips { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .space .chip {
    font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.88);
    padding: 7px 16px; border-radius: var(--r-pill);
    background: rgba(255,255,255,0.13);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
    backdrop-filter: blur(14px);
  }
  .space .chip.more { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.55); }

  /* mini poster strip, right edge */
  .strip { position: absolute; z-index: 2; right: 36px; bottom: -16px; display: flex; gap: 14px; }
  .strip .poster { width: 96px; height: 144px; border-radius: 8px; box-shadow: 0 14px 36px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.10); }
  .strip .poster::after { display: none; }
  .strip .r1 { transform: rotate(-5deg) translateY(8px); }
  .strip .r2 { transform: rotate(2deg); }
  .strip .r3 { transform: rotate(8deg) translateY(10px); }

  .scene-music {
    background:
      radial-gradient(80% 70% at 76% 18%, rgba(217, 142, 192, 0.42) 0%, rgba(0,0,0,0) 58%),
      radial-gradient(90% 70% at 22% 90%, rgba(70, 26, 96, 0.7) 0%, rgba(0,0,0,0) 65%),
      linear-gradient(190deg, #1c0b22 0%, #0b0410 60%, #030106 100%);
  }
  .scene-books {
    background:
      radial-gradient(85% 70% at 70% 12%, rgba(232, 214, 176, 0.34) 0%, rgba(0,0,0,0) 56%),
      radial-gradient(90% 80% at 20% 95%, rgba(96, 64, 24, 0.62) 0%, rgba(0,0,0,0) 62%),
      linear-gradient(188deg, #221607 0%, #100a03 58%, #040201 100%);
  }
</style>
</head>
<body>
<div class="stage">

  <div class="hd">
    <h1>Spaces</h1>
    <div class="sub">4 LIBRARIES · DEMO.SILOSERVER.ORG</div>
    <div class="hint"><b>PRESS</b> TO ENTER · <b>OPTIONS</b> TO REORDER</div>
  </div>

  <div class="grid">

    <div class="space">
      <div class="bg scene-dune"></div>
      <div class="strip">
        <div class="poster p-fire r1"></div>
        <div class="poster p-indigo r2"></div>
        <div class="poster p-coral r3"></div>
      </div>
      <div class="inner">
        <div class="ic"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 5v14M17 5v14"/></svg></div>
        <h2>Movies</h2>
        <div class="ct">1,284 FILMS · 12 ADDED THIS WEEK</div>
      </div>
    </div>

    <div class="space focused">
      <div class="bg scene-severance"></div>
      <div class="strip">
        <div class="poster p-teal r1"></div>
        <div class="poster p-steel r2"></div>
        <div class="poster p-gold r3"></div>
      </div>
      <div class="inner">
        <div class="ic"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8M12 18v3"/></svg></div>
        <h2>TV Shows</h2>
        <div class="ct">412 SERIES · 3 NEW EPISODES TODAY</div>
        <div class="chips">
          <div class="chip">Currently Airing</div>
          <div class="chip">Sci-Fi</div>
          <div class="chip">HBO</div>
          <div class="chip more">+ 9 collections</div>
        </div>
      </div>
    </div>

    <div class="space">
      <div class="bg scene-music"></div>
      <div class="strip">
        <div class="poster p-dusk r1"></div>
        <div class="poster p-mono r2"></div>
        <div class="poster p-crimson r3"></div>
      </div>
      <div class="inner">
        <div class="ic"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
        <h2>Music</h2>
        <div class="ct">8,932 TRACKS · 612 ALBUMS</div>
      </div>
    </div>

    <div class="space">
      <div class="bg scene-books"></div>
      <div class="strip">
        <div class="poster p-sand r1"></div>
        <div class="poster p-moss r2"></div>
        <div class="poster p-ice r3"></div>
      </div>
      <div class="inner">
        <div class="ic"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2V5zM11 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg></div>
        <h2>Audiobooks</h2>
        <div class="ct">167 BOOKS · 41H IN PROGRESS</div>
      </div>
    </div>

  </div>

  <div class="grain"></div>
</div>
</body>
</html>
