name: Prairie
options:
  bundleIdPrefix: org.prairieserver.prairie
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  configs:
    Debug:
      # Required for `@testable import Prairie` in PrairieTests; Xcode's Debug
      # template sets this but XcodeGen does not.
      ENABLE_TESTABILITY: "YES"
  base:
    SWIFT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    # DEVELOPMENT_TEAM is intentionally omitted — set via the DEVELOPMENT_TEAM env var locally
    # or injected by the CI pipeline.
    CODE_SIGN_STYLE: Automatic
    # SPM packages (Nuke, FFmpeg) only ship arm64 simulator slices. Exclude
    # x86_64 for all simulator SDKs so Apple Silicon Macs don't try to link
    # the missing slice.
    EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

packages:
  # FFmpeg xcframeworks (LGPL). Provides the Libavcodec / Libavformat /
  # Libavutil / Libswresample modules consumed by CoreMediaPlayerCore.
  # Smaller and cleaner than the old player dependency: ships only the
  # FFmpeg libraries with no libmpv GPL surface. Vendored copy of
  # mpvkit/ffmpeg-build at b38afaffe8a38c82c3922d36e044a915bf668f27 (tip of
  # main, includes the post-7.1.0 HLS seek fix): upstream is archived, and
  # the Libuavs3d 1.2.1 release asset it references was re-published with a
  # new checksum on 2026-04-23, so the remote manifest can never resolve
  # again. See Vendor/ffmpeg-build/Package.swift for details.
  FFmpeg:
    path: Vendor/ffmpeg-build
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.8.0"
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: "0.10.3"

targets:
  Prairie:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.xcodeproj"
          - "**/*.xcworkspace"
          - "macOS/**"
      - path: Resources
        buildPhase: resources
    # PRODUCT_BUNDLE_IDENTIFIER and CODE_SIGN_ENTITLEMENTS live in
    # Signing/Prairie.xcconfig so local contributors can override
    # them via Signing/Local.xcconfig without dirtying this file.
    # Target-level `settings` entries win over xcconfig, so they MUST
    # NOT be set below.
    configFiles:
      Debug: Signing/Prairie.xcconfig
      Release: Signing/Prairie.xcconfig
    settings:
      base:
        PRODUCT_NAME: Prairie
        INFOPLIST_FILE: iosApp/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SWIFT_OBJC_BRIDGING_HEADER: iosApp/Screens/Player/CoreMedia/PrairiePlayerBridging.h
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - package: FFmpeg
        product: FFmpeg
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: PrairieNotificationService
        embed: true
      - target: PrairieDownloadsActivity
        embed: true

  # NOTE: tvOS-specific source files live under iosApp/tvOS/. They are guarded
  # by #if os(tvOS) so they compile out on the iOS target even though the
  # directory is included in both targets' source tree.
  PrairieTV:
    type: application
    platform: tvOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.xcodeproj"
          - "**/*.xcworkspace"
          - "Info.plist"
          - "macOS/**"
      - path: Resources
        buildPhase: resources
    # PRODUCT_BUNDLE_IDENTIFIER and CODE_SIGN_ENTITLEMENTS live in
    # Signing/PrairieTV.xcconfig so local contributors can override
    # them via Signing/Local.xcconfig without dirtying this file.
    # Target-level `settings` entries win over xcconfig, so they MUST
    # NOT be set below.
    configFiles:
      Debug: Signing/PrairieTV.xcconfig
      Release: Signing/PrairieTV.xcconfig
    settings:
      base:
        PRODUCT_NAME: PrairieTV
        INFOPLIST_FILE: iosApp/tvOS-Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: TVAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        # Bridging header exposes the Obj-C audio graph exception catcher on
        # Apple targets and the private AVDisplayCriteria initializer on tvOS.
        SWIFT_OBJC_BRIDGING_HEADER: iosApp/Screens/Player/CoreMedia/PrairiePlayerBridging.h
    dependencies:
      - package: FFmpeg
        product: FFmpeg
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: PrairieTVTopShelf
        embed: true

  PrairieMac:
    type: application
    platform: macOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.xcodeproj"
          - "**/*.xcworkspace"
          - "Info.plist"
          - "tvOS-Info.plist"
          - "TopShelf/**"
          - "tvOS/**"
          - "Screens/Player/AVPlayerRoute/AVPlayerSurface.swift"
          - "Screens/Player/CoreMedia/PlayerSurface.swift"
          - "Screens/Player/iOS/**"
          - "Screens/Player/tvOS/**"
          - "Screens/Player/PlayerView.swift"
      - path: iosApp/Screens/Player/PlayerTimeFormatter.swift
      - path: iosApp/tvOS/Caching/ArtworkURL.swift
      - path: iosApp/tvOS/Caching/CachedAsyncImage.swift
      - path: iosApp/tvOS/Caching/PosterImageCache.swift
      - path: Resources
        buildPhase: resources
    postBuildScripts:
      - path: scripts/prepare-macos-ffmpeg-frameworks.sh
        name: Prepare macOS FFmpeg Frameworks
        basedOnDependencyAnalysis: false
    configFiles:
      Debug: Signing/PrairieMac.xcconfig
      Release: Signing/PrairieMac.xcconfig
    settings:
      base:
        PRODUCT_NAME: Prairie
        INFOPLIST_FILE: macOS-Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: "macosx"
        SWIFT_OBJC_BRIDGING_HEADER: iosApp/Screens/Player/CoreMedia/PrairiePlayerBridging.h
    dependencies:
      - package: FFmpeg
        product: FFmpeg
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI

  # Top Shelf extension: populates the Apple TV Home Screen with
  # Continue Watching / Next Up rows when the Prairie app icon is
  # focused. Shares auth state with the host app via an App Group +
  # shared Keychain access group. Compiles `iosApp/Shared/` for the
  # SharedStorage helpers used on both sides.
  PrairieTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: iosApp/Shared
        excludes:
          - "Diagnostics/**"
    # PRODUCT_BUNDLE_IDENTIFIER and CODE_SIGN_ENTITLEMENTS live in
    # Signing/PrairieTVTopShelf.xcconfig so local contributors can
    # override them via Signing/Local.xcconfig without dirtying this
    # file. Target-level `settings` entries win over xcconfig, so they
    # MUST NOT be set below.
    configFiles:
      Debug: Signing/PrairieTVTopShelf.xcconfig
      Release: Signing/PrairieTVTopShelf.xcconfig
    settings:
      base:
        PRODUCT_NAME: PrairieTVTopShelf
        INFOPLIST_FILE: TopShelf/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
    dependencies:
      - sdk: TVServices.framework

  # iOS Notification Service extension: enriches generic APNs alerts by
  # fetching compact display metadata directly from the user's Prairie server.
  # Shares active server/profile/token state via the App Group + shared
  # Keychain access group, but does not link the main app's AuthService.
  PrairieNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: iosApp/Notifications/ApplePushDisplayMetadata.swift
      - path: iosApp/Shared/SharedStorage.swift
    configFiles:
      Debug: Signing/PrairieNotificationService.xcconfig
      Release: Signing/PrairieNotificationService.xcconfig
    settings:
      base:
        PRODUCT_NAME: PrairieNotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - sdk: UserNotifications.framework

  # iOS WidgetKit extension hosting the downloads Live Activity: the
  # lock-screen / Dynamic Island progress card for active downloads. The
  # host app owns the activity lifecycle (DownloadLiveActivityController)
  # and pushes content states through ActivityKit; this target only renders
  # them, so it compiles just the shared attributes schema and needs no
  # entitlements or shared storage.
  PrairieDownloadsActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: DownloadsActivity
      - path: iosApp/Downloads/DownloadActivityAttributes.swift
    configFiles:
      Debug: Signing/PrairieDownloadsActivity.xcconfig
      Release: Signing/PrairieDownloadsActivity.xcconfig
    settings:
      base:
        PRODUCT_NAME: PrairieDownloadsActivity
        INFOPLIST_FILE: DownloadsActivity/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # FFmpeg-free macOS framework for Networking coverage CI. Compiles the
  # gated Networking surface + SharedStorage helpers, with thin stubs for
  # AuthService / DiagnosticsCoordinator / ContinuumAPI. Module name stays
  # `Prairie` so existing `@testable import Prairie` tests run unchanged.
  # macOS + no TEST_HOST avoids the iOS simulator boot/app-launch tax that
  # dominated the previous ~7m Apple CI wall clock.
  PrairieNetworkingHost:
    type: framework
    platform: macOS
    sources:
      # Only the gated Networking surface + helpers. Live ContinuumAPI /
      # prefs stores / feature stores pull half the app; CI stubs cover the
      # few symbols ServerRegistry still calls.
      - path: iosApp/Networking
        excludes:
          - ContinuumAPI.swift
          - ContinuumAPI+LiveTV.swift
          - ContinuumAPI+Requests.swift
          - ContinuumAI.swift
          - HTTPClient.swift
          - OverlayPrefsStore.swift
          - PlaybackPrefsStore.swift
          - ProfilePrefsStore.swift
          - ConnectionMonitor.swift
          - DiagnosticsAPI.swift
          - AICapabilities.swift
          - RequestsFeatureStore.swift
          - LiveTVFeatureStore.swift
          - LAN/FramedJSONSession.swift
      - path: iosApp/Shared/SharedStorage.swift
      - path: iosApp/Shared/AppleDeviceIdentity.swift
      - path: iosApp/Screens/Profiles/ProfileModels.swift
      - path: iosApp/Screens/Player/PlayerTrack.swift
      - path: CI/NetworkingHost
    settings:
      base:
        PRODUCT_NAME: PrairieNetworkingHost
        PRODUCT_MODULE_NAME: Prairie
        PRODUCT_BUNDLE_IDENTIFIER: org.prairieserver.prairie.networkinghost
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        ENABLE_TESTABILITY: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        MACOSX_DEPLOYMENT_TARGET: "26.0"

  # Hostless (logic) unit tests against PrairieNetworkingHost — no app host,
  # no iOS simulator.
  PrairieNetworkingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        includes:
          - NetworkingGateBoostTests.swift
          - NetworkingModelsCoverageTests.swift
          - NetworkingModelsGateFillTests.swift
          - TokenStorePersistenceTests.swift
          - ServerRegistryMigrationTests.swift
          - WireFormatAndRequestsModelTests.swift
          - AuthAndDeviceLoginModelTests.swift
          - ResponseCacheTests.swift
          - PrairieFrameTests.swift
          - TrackSelectionPersistenceTests.swift
          - LiveTVModelDecodingTests.swift
          - AIModelDecodingTests.swift
          - PlaybackPrefsModelTests.swift
          - SubtitleSearchModelTests.swift
          - AppUpdateCheckerTests.swift
          - AIJobPollerTests.swift
          - LibraryVisibilityTests.swift
    dependencies:
      - target: PrairieNetworkingHost
    settings:
      base:
        PRODUCT_NAME: PrairieNetworkingTests
        GENERATE_INFOPLIST_FILE: "YES"
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        CODE_SIGNING_ALLOWED: "NO"
        MACOSX_DEPLOYMENT_TARGET: "26.0"

  # Unit-test bundle for the iOS Prairie app. Hosts the XCTest cases under
  # Tests/ and loads the Prairie.app binary so `@testable import Prairie` can
  # reach the app's internal types (policies, codecs, formatting helpers).
  PrairieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Prairie
      # PacketQueueTests allocates real AVPackets, so the test bundle needs
      # the Libav* module maps the app target gets from this package.
      # link: false — the symbols come from the test host (BUNDLE_LOADER);
      # linking the static FFmpeg libs a second time fails the link.
      - package: FFmpeg
        product: FFmpeg
        link: false
      # SwiftUI view introspection for high-risk screen smoke tests only
      # (see AGENTS.md). Keep this off the app targets.
      - package: ViewInspector
        product: ViewInspector
    settings:
      base:
        PRODUCT_NAME: PrairieTests
        GENERATE_INFOPLIST_FILE: "YES"
        # Without an explicit SDKROOT the generated test config resolves
        # BUILT_PRODUCTS_DIR without a platform suffix, so TEST_HOST points
        # at .../Debug/Prairie.app and xcodebuild can't find the test host.
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Prairie.app/Prairie"
        SWIFT_OBJC_BRIDGING_HEADER: iosApp/Screens/Player/CoreMedia/PrairiePlayerBridging.h

schemes:
  # CI-only: Networking coverage gate without linking FFmpeg into Prairie.app.
  PrairieNetworkingCI:
    build:
      targets:
        PrairieNetworkingHost: all
        PrairieNetworkingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrairieNetworkingTests
    analyze:
      config: Debug
  Prairie:
    build:
      targets:
        Prairie: all
        PrairieTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrairieTests
    archive:
      config: Release
    analyze:
      config: Debug
    profile:
      config: Release
  PrairieNoDebugger:
    build:
      targets:
        Prairie: all
    run:
      config: Debug
      debugEnabled: false
      disableMainThreadChecker: true
      disableThreadPerformanceChecker: true
      enableGPUFrameCaptureMode: disabled
      enableGPUValidationMode: false
    analyze:
      config: Debug
    profile:
      config: Release
  PrairieTV:
    build:
      targets:
        PrairieTV: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
    analyze:
      config: Debug
    profile:
      config: Release
  PrairieMac:
    build:
      targets:
        PrairieMac: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
    analyze:
      config: Debug
    profile:
      config: Release
