name: Prairie
options:
  bundleIdPrefix: org.prairieserver.prairie
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  configs:
    Debug:
      # Required for `@testable import Prairie` in PrairieTests; Xcode's Debug
      # template sets this but XcodeGen does not.
      ENABLE_TESTABILITY: "YES"
  base:
    SWIFT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    # DEVELOPMENT_TEAM is intentionally omitted — set via the DEVELOPMENT_TEAM env var locally
    # or injected by the CI pipeline.
    CODE_SIGN_STYLE: Automatic
    # Media/image packages ship arm64 simulator slices. Exclude x86_64 for all
    # simulator SDKs so Apple Silicon Macs don't try to link missing slices.
    EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

# One committed version/channel baseline for every shippable target: the app
# and its embedded extensions must ship the same CFBundleVersion, and six
# copies of the same three lines drift.
#
# This is a target template, NOT the project-level `settings.base`, and that
# distinction is load-bearing. Xcode resolves build settings target settings >
# target xcconfig > project settings > project xcconfig. Every target below
# carries a Signing/<Target>.xcconfig that ends with
# `#include? "Local.xcconfig"` — a gitignored file contributors are told to
# create. At project level a stray MARKETING_VERSION in someone's
# Local.xcconfig would silently outrank the committed value; template settings
# are merged into the target, where they win, which is the same guarantee the
# per-target blocks used to provide. CI still outranks everything via
# xcodebuild xcargs (command-line settings beat xcconfigs too).
targetTemplates:
  ShippableProduct:
    settings:
      base:
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        # Surfaced to the app as the `PrairieBuildChannel` Info.plist key and
        # reported to the server as X-Prairie-Client-Channel. The unsigned
        # sideload lanes override this to `sideload`; DEBUG builds report
        # `dev` regardless. Every target using this template must declare the
        # key in its Info.plist or it reports `release` no matter what.
        PRAIRIE_BUILD_CHANNEL: release

packages:
  # The only media engine in the replacement player. Keep this at an exact
  # reviewed revision; Package.resolved also freezes its binary dependencies.
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    revision: 0ae80496ab6f3fda135f43ef195ff10961c0e625
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: "0.10.3"
  Nuke:
    url: https://github.com/kean/Nuke
    from: "12.8.0"

targets:
  Prairie:
    templates: [ShippableProduct]
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.xcodeproj"
          - "**/*.xcworkspace"
          - "macOS/**"
      - path: Resources
        buildPhase: resources
        excludes:
          - startup_splash.mp4
    # PRODUCT_BUNDLE_IDENTIFIER and CODE_SIGN_ENTITLEMENTS live in
    # Signing/Prairie.xcconfig so local contributors can override
    # them via Signing/Local.xcconfig without dirtying this file.
    # Target-level `settings` entries win over xcconfig, so they MUST
    # NOT be set below.
    configFiles:
      Debug: Signing/Prairie.xcconfig
      Release: Signing/Prairie.xcconfig
    settings:
      base:
        PRODUCT_NAME: Prairie
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - package: AetherEngine
        product: AetherEngine
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: PrairieNotificationService
        embed: true
      - target: PrairieDownloadsActivity
        embed: true

  # NOTE: tvOS-specific source files live under iosApp/tvOS/. They are guarded
  # by #if os(tvOS) so they compile out on the iOS target even though the
  # directory is included in both targets' source tree.
  PrairieTV:
    templates: [ShippableProduct]
    type: application
    platform: tvOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.xcodeproj"
          - "**/*.xcworkspace"
          - "Info.plist"
          - "macOS/**"
      - path: Resources
        buildPhase: resources
        excludes:
          - startup_splash.mp4
    # PRODUCT_BUNDLE_IDENTIFIER and CODE_SIGN_ENTITLEMENTS live in
    # Signing/PrairieTV.xcconfig so local contributors can override
    # them via Signing/Local.xcconfig without dirtying this file.
    # Target-level `settings` entries win over xcconfig, so they MUST
    # NOT be set below.
    configFiles:
      Debug: Signing/PrairieTV.xcconfig
      Release: Signing/PrairieTV.xcconfig
    settings:
      base:
        PRODUCT_NAME: PrairieTV
        INFOPLIST_FILE: iosApp/tvOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: TVAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - package: AetherEngine
        product: AetherEngine
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: PrairieTVTopShelf
        embed: true

  PrairieMac:
    templates: [ShippableProduct]
    type: application
    platform: macOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.xcodeproj"
          - "**/*.xcworkspace"
          - "Info.plist"
          - "tvOS-Info.plist"
          - "PrivacyInfo.xcprivacy"
          - "TopShelf/**"
          - "tvOS/**"
          - "Screens/Player/iOS/**"
          - "Screens/Player/tvOS/**"
          - "Screens/Player/PlayerView.swift"
      - path: iosApp/Screens/Player/PlayerTimeFormatter.swift
      - path: iosApp/tvOS/Caching/CachedAsyncImage.swift
      - path: iosApp/tvOS/Caching/PosterImageCache.swift
      - path: Resources
        buildPhase: resources
        excludes:
          - startup_splash.mp4
    configFiles:
      Debug: Signing/PrairieMac.xcconfig
      Release: Signing/PrairieMac.xcconfig
    settings:
      base:
        PRODUCT_NAME: Prairie
        INFOPLIST_FILE: macOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: "macosx"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: AetherEngine
        product: AetherEngine
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI

  # Top Shelf extension: populates the Apple TV Home Screen with
  # Continue Watching / Next Up rows when the Prairie app icon is
  # focused. Shares auth state with the host app via an App Group +
  # shared Keychain access group. Compiles `iosApp/Shared/` for the
  # SharedStorage helpers used on both sides.
  PrairieTVTopShelf:
    templates: [ShippableProduct]
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: iosApp/Shared
        excludes:
          - "Diagnostics/**"
    # PRODUCT_BUNDLE_IDENTIFIER and CODE_SIGN_ENTITLEMENTS live in
    # Signing/PrairieTVTopShelf.xcconfig so local contributors can
    # override them via Signing/Local.xcconfig without dirtying this
    # file. Target-level `settings` entries win over xcconfig, so they
    # MUST NOT be set below.
    configFiles:
      Debug: Signing/PrairieTVTopShelf.xcconfig
      Release: Signing/PrairieTVTopShelf.xcconfig
    settings:
      base:
        PRODUCT_NAME: PrairieTVTopShelf
        INFOPLIST_FILE: TopShelf/Info.plist
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
    dependencies:
      - sdk: TVServices.framework

  # iOS Notification Service extension: enriches generic APNs alerts by
  # fetching compact display metadata directly from the user's Prairie server.
  # Shares active server/profile/token state via the App Group + shared
  # Keychain access group, but does not link the main app's AuthService.
  PrairieNotificationService:
    templates: [ShippableProduct]
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: iosApp/Notifications/ApplePushDisplayMetadata.swift
      - path: iosApp/Shared/KeychainAudience.swift
      - path: iosApp/Shared/SharedStorage.swift
    configFiles:
      Debug: Signing/PrairieNotificationService.xcconfig
      Release: Signing/PrairieNotificationService.xcconfig
    settings:
      base:
        PRODUCT_NAME: PrairieNotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - sdk: UserNotifications.framework

  # iOS WidgetKit extension hosting the downloads Live Activity: the
  # lock-screen / Dynamic Island progress card for active downloads. The
  # host app owns the activity lifecycle (DownloadLiveActivityController)
  # and pushes content states through ActivityKit; this target only renders
  # them, so it compiles just the shared attributes schema and needs no
  # entitlements or shared storage.
  PrairieDownloadsActivity:
    templates: [ShippableProduct]
    type: app-extension
    platform: iOS
    sources:
      - path: DownloadsActivity
      - path: iosApp/Downloads/DownloadActivityAttributes.swift
    configFiles:
      Debug: Signing/PrairieDownloadsActivity.xcconfig
      Release: Signing/PrairieDownloadsActivity.xcconfig
    settings:
      base:
        PRODUCT_NAME: PrairieDownloadsActivity
        INFOPLIST_FILE: DownloadsActivity/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Unit-test bundle for the iOS Prairie app. Hosts the XCTest cases under
  # Tests/ and loads the Prairie.app binary so `@testable import Prairie` can
  # reach the app's internal types (policies, codecs, formatting helpers).
  PrairieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          # Re-declared below with an explicit build phase. Both spellings:
          # the directory itself, and everything under it.
          - "Fixtures/SettingsContract"
          - "Fixtures/SettingsContract/**"
          - "Fixtures/PlaybackV3"
          - "Fixtures/PlaybackV3/**"
      # The vendored settings contract. SettingsConformanceTests reads both
      # files out of the test bundle at runtime and fails hard when either is
      # missing, so the build phase is stated rather than left to XcodeGen's
      # extension-based inference: a cross-platform drift gate that quietly
      # stopped being bundled is worse than no gate at all.
      - path: Tests/Fixtures/SettingsContract/conformance.json
        buildPhase: resources
      - path: Tests/Fixtures/SettingsContract/manifest.json
        buildPhase: resources
      # Provenance for the two files above — which server commits they came
      # from, and how to re-vendor. In the project so it is discoverable next
      # to them, out of the bundle because nothing reads it at runtime.
      - path: Tests/Fixtures/SettingsContract/SOURCE
        buildPhase: none
      # Playback V3's server-generated contract corpus. List every executable
      # fixture explicitly so an XcodeGen inference change cannot silently
      # remove this cross-repository gate from the test bundle.
      - path: Tests/Fixtures/PlaybackV3/attempt_keys.json
        buildPhase: resources
      - path: Tests/Fixtures/PlaybackV3/capability_response.json
        buildPhase: resources
      - path: Tests/Fixtures/PlaybackV3/conformance_matrix.json
        buildPhase: resources
      - path: Tests/Fixtures/PlaybackV3/decision_response.json
        buildPhase: resources
      - path: Tests/Fixtures/PlaybackV3/error_response.json
        buildPhase: resources
      - path: Tests/Fixtures/PlaybackV3/replan_request.json
        buildPhase: resources
      - path: Tests/Fixtures/PlaybackV3/route_event.json
        buildPhase: resources
      - path: Tests/Fixtures/PlaybackV3/start_request.json
        buildPhase: resources
      - path: Tests/Fixtures/PlaybackV3/subtitle_inventory.json
        buildPhase: resources
      - path: Tests/Fixtures/PlaybackV3/SOURCE
        buildPhase: none
    dependencies:
      - target: Prairie
      - package: ViewInspector
        product: ViewInspector
    settings:
      base:
        PRODUCT_NAME: PrairieTests
        GENERATE_INFOPLIST_FILE: "YES"
        # Without an explicit SDKROOT the generated test config resolves
        # BUILT_PRODUCTS_DIR without a platform suffix, so TEST_HOST points
        # at .../Debug/Prairie.app and xcodebuild can't find the test host.
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Prairie.app/Prairie"

  PrairieNetworkingHost:
    type: framework
    platform: macOS
    sources:
      # Only the gated Networking surface + helpers. Live ContinuumAPI /
      # prefs stores / feature stores pull half the app; CI stubs cover the
      # few symbols ServerRegistry still calls.
      - path: iosApp/Networking
        excludes:
          - ContinuumAPI+LiveTV.swift
          - ContinuumAPI+Requests.swift
          - ContinuumAI.swift
          - OverlayPrefsStore.swift
          - PlaybackPrefsStore.swift
          - ProfilePrefsStore.swift
          - ProfileSettingsWriter.swift
          - ConnectionMonitor.swift
          - DiagnosticsAPI.swift
          - AICapabilities.swift
          - RequestsFeatureStore.swift
          - LiveTVFeatureStore.swift
          - LAN/FramedJSONSession.swift
      - path: iosApp/Shared/SharedStorage.swift
      - path: iosApp/Shared/KeychainAudience.swift
      - path: iosApp/Shared/ImageSizeSelection.swift
      - path: iosApp/Shared/AppleDecodeCapabilities.swift
      - path: iosApp/Shared/ProfileLaunchBehavior.swift
      - path: iosApp/Shared/ProfileLaunchState.swift
      - path: iosApp/Shared/RememberedProfile.swift
      - path: iosApp/Shared/ProfileLaunchResolution.swift
      - path: iosApp/Shared/AppleDeviceIdentity.swift
      - path: iosApp/Shared/DateFormatters.swift
      - path: iosApp/tvOS/Caching/ImageFormats.swift
      - path: iosApp/Screens/Profiles/ProfileModels.swift
      - path: iosApp/Screens/Profiles/ProfileLaunchPreferences.swift
      - path: iosApp/Navigation/UICustomizationPreferences.swift
      - path: iosApp/Navigation/TabRouter.swift
      - path: iosApp/Navigation/AppNavPreferences.swift
      - path: iosApp/Screens/Player/PlayerTrack.swift
      - path: iosApp/Screens/Auth/AuthModels.swift
      - path: iosApp/Screens/Calendar/CalendarModels.swift
      - path: iosApp/Screens/Player/Subtitles/SubtitleAppearance.swift
      - path: iosApp/Screens/Player/ProtocolV3/PlaybackProtocolV3Models.swift
      - path: CI/NetworkingHost
    settings:
      base:
        # Product/module must be `Prairie` so shared `@testable import Prairie`
        # sources work. Target name stays PrairieNetworkingHost to avoid
        # colliding with the iOS Prairie.app target name.
        PRODUCT_NAME: Prairie
        PRODUCT_MODULE_NAME: Prairie
        PRODUCT_BUNDLE_IDENTIFIER: org.prairieserver.prairie.networkinghost
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        ENABLE_TESTABILITY: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        # GHA macos-15 runners are still on macOS 15.x; keep this CI-only
        # target runnable there even though the app ships with macOS 26 SDK.
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks", "@loader_path/Frameworks"]


  PrairieNetworkingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        includes:
          - NetworkingGateBoostTests.swift
          - NetworkingModelsCoverageTests.swift
          - NetworkingModelsGateFillTests.swift
          - TokenStorePersistenceTests.swift
          - ServerRegistryMigrationTests.swift
          - WireFormatAndRequestsModelTests.swift
          - AuthAndDeviceLoginModelTests.swift
          - ResponseCacheTests.swift
          - PrairieFrameTests.swift
          - TrackSelectionPersistenceTests.swift
          - LiveTVModelDecodingTests.swift
          - AIModelDecodingTests.swift
          - PlaybackPrefsModelTests.swift
          - SubtitleSearchModelTests.swift
          - AppUpdateCheckerTests.swift
          - AIJobPollerTests.swift
          - LibraryVisibilityTests.swift
          - PrairieQualityPresetsTests.swift
          - SettingValueModelsGateFillTests.swift
          - SettingValuesAPITests.swift
          - SettingsConformanceTests.swift
          - SettingsContractResolve.swift
      - path: Tests/Fixtures/SettingsContract/conformance.json
        buildPhase: resources
      - path: Tests/Fixtures/SettingsContract/manifest.json
        buildPhase: resources
    dependencies:
      - target: PrairieNetworkingHost
    settings:
      base:
        PRODUCT_NAME: PrairieNetworkingTests
        GENERATE_INFOPLIST_FILE: "YES"
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        CODE_SIGNING_ALLOWED: "NO"
        MACOSX_DEPLOYMENT_TARGET: "15.0"

schemes:
  # CI-only: Networking coverage gate without linking FFmpeg into Prairie.app.
  PrairieNetworkingCI:
    build:
      targets:
        PrairieNetworkingHost: all
        PrairieNetworkingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrairieNetworkingTests
    analyze:
      config: Debug
  Prairie:
    build:
      targets:
        Prairie: all
        PrairieTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrairieTests
    archive:
      config: Release
    analyze:
      config: Debug
    profile:
      config: Release
  PrairieNoDebugger:
    build:
      targets:
        Prairie: all
    run:
      config: Debug
      debugEnabled: false
      disableMainThreadChecker: true
      disableThreadPerformanceChecker: true
      enableGPUFrameCaptureMode: disabled
      enableGPUValidationMode: false
    analyze:
      config: Debug
    profile:
      config: Release
  PrairieTV:
    build:
      targets:
        PrairieTV: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
    analyze:
      config: Debug
    profile:
      config: Release
  PrairieMac:
    build:
      targets:
        PrairieMac: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
    analyze:
      config: Debug
    profile:
      config: Release
